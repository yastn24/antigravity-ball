<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juego Neón Antigravedad - Ultimate Edition</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #05050d;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      box-shadow: 0 0 40px rgba(0, 240, 255, 0.4);
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #00f0ff;
    }
    canvas { display: block; background: #08081a; }
    
    .hud {
      position: absolute;
      top: 15px; left: 15px; right: 15px;
      display: flex; justify-content: space-between;
      pointer-events: none; font-size: 15px; font-weight: bold;
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.8); z-index: 5;
    }
    .hud-box {
      background: rgba(10, 10, 30, 0.85); padding: 6px 14px;
      border-radius: 18px; border: 1px solid rgba(0, 240, 255, 0.4);
    }

    .overlay-screen {
      position: absolute; inset: 0;
      background: rgba(5, 5, 15, 0.95);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 10; transition: opacity 0.3s ease;
    }
    .hidden { display: none !important; }

    h1 {
      font-size: 42px; color: #00f0ff;
      text-shadow: 0 0 20px #00f0ff, 0 0 40px #ff007f;
      margin-bottom: 10px; text-align: center;
    }
    p { font-size: 16px; color: #aaa; margin-bottom: 20px; text-align: center; }

    .btn {
      background: #00f0ff; color: #05050d; border: none;
      padding: 10px 24px; font-size: 16px; font-weight: bold;
      border-radius: 25px; cursor: pointer;
      box-shadow: 0 0 15px #00f0ff; transition: transform 0.2s, background 0.2s, color 0.2s;
      margin: 6px;
    }
    .btn:hover {
      transform: scale(1.08); background: #ff007f; color: #fff;
      box-shadow: 0 0 20px #ff007f;
    }

    .levels-grid {
      display: grid; grid-template-columns: repeat(5, 1fr);
      gap: 12px; margin: 15px 0; max-width: 80%;
    }
    .level-btn {
      width: 60px; height: 60px; border-radius: 12px;
      border: 2px solid #00f0ff; background: rgba(0, 240, 255, 0.1);
      color: #00f0ff; font-size: 16px; font-weight: bold;
      cursor: pointer; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.2); transition: all 0.2s;
    }
    .level-btn:hover:not(.locked) {
      background: #00f0ff; color: #000; box-shadow: 0 0 15px #00f0ff;
    }
    .level-btn.locked {
      border-color: #444; color: #444; background: rgba(20, 20, 30, 0.5);
      cursor: not-allowed; box-shadow: none;
    }

    /* Tienda */
    .shop-grid { display: flex; gap: 15px; margin: 15px 0; }
    .shop-item {
      border: 2px solid #00f0ff; background: rgba(10,10,30,0.8);
      padding: 15px; border-radius: 12px; text-align: center; width: 140px;
    }
    .shop-item.selected { border-color: #ff007f; box-shadow: 0 0 15px #ff007f; }

    /* Toast Logros */
    #achievement-toast {
      position: absolute; bottom: 20px; right: 20px;
      background: rgba(0, 240, 255, 0.9); color: #000;
      padding: 10px 20px; border-radius: 10px; font-weight: bold;
      box-shadow: 0 0 20px #00f0ff; z-index: 20;
      transform: translateY(100px); opacity: 0; transition: all 0.4s ease;
    }
    #achievement-toast.show { transform: translateY(0); opacity: 1; }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="hud">
      <div class="hud-box">NIVEL: <span id="level-display">1</span></div>
      <div class="hud-box">PUNTOS: <span id="score">0</span></div>
      <div class="hud-box" style="color: #ff007f;">VIDAS: <span id="lives">❤️❤️❤️</span></div>
      <div class="hud-box" style="color: #00f0ff;">TIEMPO: <span id="timer">5.0</span>s</div>
    </div>

    <div id="achievement-toast">🏆 Logro Desbloqueado: <span id="ach-title"></span></div>

    <!-- Pantallas -->
    <div id="start-screen" class="overlay-screen">
      <h1>NEÓN ANTIGRAVEDAD</h1>
      <p>Esquiva láseres, usa campos de gravedad, bumpers y domina la física neón.</p>
      <div>
        <button class="btn" onclick="showLevelSelect()">JUGAR</button>
        <button class="btn" onclick="showShop()">TIENDA DE SKINS</button>
      </div>
    </div>

    <div id="level-select-screen" class="overlay-screen hidden">
      <h1>SELECCIONAR NIVEL</h1>
      <div class="levels-grid" id="levels-container"></div>
      <button class="btn" onclick="showStartScreen()">VOLVER</button>
    </div>

    <div id="shop-screen" class="overlay-screen hidden">
      <h1>TIENDA DE SKINS</h1>
      <p>Puntos Disponibles: <span id="shop-score">0</span></p>
      <div class="shop-grid" id="shop-container"></div>
      <button class="btn" onclick="showStartScreen()">VOLVER</button>
    </div>

    <div id="game-over-screen" class="overlay-screen hidden">
      <h1 style="color: #ff0055; text-shadow: 0 0 20px #ff0055;">¡GAME OVER!</h1>
      <p>Puntuación Final: <span id="final-score">0</span></p>
      <button class="btn" onclick="retryLevel()">Reintentar</button>
      <button class="btn" onclick="showLevelSelect()">Menú de Niveles</button>
    </div>

    <div id="victory-screen" class="overlay-screen hidden">
      <h1>¡NIVEL COMPLETADO!</h1>
      <p id="star-rating" style="font-size: 30px; margin: 10px 0;"></p>
      <button class="btn" onclick="loadNextLevel()">Siguiente Nivel</button>
      <button class="btn" onclick="showLevelSelect()">Seleccionar Nivel</button>
    </div>

    <canvas id="canvas" width="1000" height="700"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const timerEl = document.getElementById('timer');
    const levelDisplayEl = document.getElementById('level-display');
    const finalScoreEl = document.getElementById('final-score');
    const shopScoreEl = document.getElementById('shop-score');
    const starRatingEl = document.getElementById('star-rating');

    const startScreen = document.getElementById('start-screen');
    const levelSelectScreen = document.getElementById('level-select-screen');
    const shopScreen = document.getElementById('shop-screen');
    const gameOverScreen = document.getElementById('game-over-screen');
    const victoryScreen = document.getElementById('victory-screen');
    const levelsContainer = document.getElementById('levels-container');
    const shopContainer = document.getElementById('shop-container');

    const WIDTH = canvas.width;
    const HEIGHT = canvas.height;
    const CENTER = { x: WIDTH / 2, y: HEIGHT / 2 };

    const TOTAL_LEVELS = 10;
    let unlockedLevels = parseInt(localStorage.getItem('unlockedLevels')) || 1;
    let levelStars = JSON.parse(localStorage.getItem('levelStars')) || {};

    let score = parseInt(localStorage.getItem('savedScore')) || 0;
    let currentLevel = 1;
    let lives = 3;
    let isPlaying = false;

    // Slow Motion y Shake
    let timeDilation = 1;
    let slowMoTimer = 0;
    let shakeTimer = 0;

    // Skins
    const skins = [
      { id: 'cyan', name: 'Cian Neón', color: '#00f0ff', price: 0 },
      { id: 'pink', name: 'Rosa Plasma', color: '#ff007f', price: 100 },
      { id: 'gold', name: 'Oro Estelar', color: '#ffe600', price: 250 }
    ];
    let selectedSkin = localStorage.getItem('selectedSkin') || 'cyan';

    const ball = {
      x: CENTER.x, y: CENTER.y, vx: 0, vy: 0, radius: 12,
      isDragging: false, isLaunched: false, isReturning: false,
      launchTime: 0, returnStartTime: 0, maxFlightTime: 5000,
      collectedCoinsThisLaunch: 0, magnetActive: false, magnetTimer: 0, shieldActive: false
    };

    const MAGNET_CONFIG = { durationMs: 2500, range: 160, pullSpeed: 6 };

    let obstacles = [];
    let coins = [];
    let powerups = [];
    let portals = [];
    let particles = [];
    let trail = [];
    let bumpers = [];
    let lasers = [];
    let gravityFields = [];

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() { if (!audioCtx) audioCtx = new AudioContext(); }

    function playSound(type) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'launch') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);
        gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc.start(now); osc.stop(now + 0.15);
      } else if (type === 'coin') {
        osc.type = 'triangle'; osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.08);
        gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.start(now); osc.stop(now + 0.2);
      } else if (type === 'bounce') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(45, now + 0.06);
        gain.gain.setValueAtTime(0.12, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
        osc.start(now); osc.stop(now + 0.06);
      } else if (type === 'bumper') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(900, now + 0.2);
        gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.start(now); osc.stop(now + 0.2);
      } else if (type === 'win') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(440, now);
        osc.frequency.setValueAtTime(880, now + 0.2);
        gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
      }
    }

    function triggerAchievement(title) {
      const toast = document.getElementById('achievement-toast');
      document.getElementById('ach-title').textContent = title;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // UI
    function hideAllScreens() {
      startScreen.classList.add('hidden');
      levelSelectScreen.classList.add('hidden');
      shopScreen.classList.add('hidden');
      gameOverScreen.classList.add('hidden');
      victoryScreen.classList.add('hidden');
    }

    function showStartScreen() { hideAllScreens(); startScreen.classList.remove('hidden'); isPlaying = false; }
    function showLevelSelect() { hideAllScreens(); renderLevelButtons(); levelSelectScreen.classList.remove('hidden'); isPlaying = false; }
    function showShop() { hideAllScreens(); renderShop(); shopScreen.classList.remove('hidden'); isPlaying = false; }

    function renderLevelButtons() {
      levelsContainer.innerHTML = '';
      for (let i = 1; i <= TOTAL_LEVELS; i++) {
        const btn = document.createElement('button');
        btn.className = `level-btn ${i > unlockedLevels ? 'locked' : ''}`;
        const stars = levelStars[i] ? '⭐'.repeat(levelStars[i]) : '';
        btn.innerHTML = i > unlockedLevels ? '🔒' : `<div>${i}</div><div style="font-size:10px">${stars}</div>`;
        if (i <= unlockedLevels) btn.onclick = () => startLevel(i);
        levelsContainer.appendChild(btn);
      }
    }

    function renderShop() {
      shopScoreEl.textContent = score;
      shopContainer.innerHTML = '';
      skins.forEach(s => {
        const item = document.createElement('div');
        item.className = `shop-item ${selectedSkin === s.id ? 'selected' : ''}`;
        item.innerHTML = `<div style="width:30px;height:30px;background:${s.color};border-radius:50%;margin:0 auto 10px;"></div>
          <div><b>${s.name}</b></div><div>${s.price} Pts</div>`;
        item.onclick = () => {
          if (score >= s.price) {
            selectedSkin = s.id;
            localStorage.setItem('selectedSkin', selectedSkin);
            renderShop();
            triggerAchievement(`Skin ${s.name} equipada`);
          }
        };
        shopContainer.appendChild(item);
      });
    }

    function startLevel(lvl) {
      currentLevel = lvl;
      levelDisplayEl.textContent = currentLevel;
      lives = 3; updateLivesUI();
      hideAllScreens(); resetBallToCenter(); initLevelData();
      isPlaying = true;
    }

    function retryLevel() { startLevel(currentLevel); }
    function loadNextLevel() { if (currentLevel < TOTAL_LEVELS) startLevel(currentLevel + 1); else showLevelSelect(); }
    function updateLivesUI() { livesEl.textContent = '❤️'.repeat(Math.max(0, lives)); }

    function resetBallToCenter() {
      ball.isLaunched = false; ball.isReturning = false;
      ball.x = CENTER.x; ball.y = CENTER.y;
      ball.vx = 0; ball.vy = 0; ball.shieldActive = false; ball.magnetActive = false;
      ball.maxFlightTime = 5000; timerEl.textContent = "5.0";
    }

    function initLevelData() {
      coins = []; obstacles = []; powerups = []; portals = []; bumpers = []; lasers = []; gravityFields = [];

      const numCoins = Math.min(5 + currentLevel, 12);
      for (let i = 0; i < numCoins; i++) {
        let pos = getValidRandomPos(40);
        coins.push({ x: pos.x, y: pos.y, radius: 10 });
      }

      // Bumpers estilo Pinball
      for (let i = 0; i < 3; i++) {
        let pos = getValidRandomPos(50);
        bumpers.push({ x: pos.x, y: pos.y, radius: 20 });
      }

      // Láseres Temporizados
      if (currentLevel >= 2) {
        let pos = getValidRandomPos(80);
        lasers.push({ x: pos.x, y: pos.y, length: 150, angle: Math.PI/4, active: true, timer: 0 });
      }

      // Campo Gravitatorio
      if (currentLevel >= 3) {
        let pos = getValidRandomPos(100);
        gravityFields.push({ x: pos.x, y: pos.y, radius: 90, force: 0.25 });
      }

      // Muros
      const numObstacles = Math.min(2 + currentLevel, 8);
      for (let i = 0; i < numObstacles; i++) {
        let pos = getValidRandomPos(60);
        obstacles.push({
          x: pos.x, y: pos.y, w: 80, h: 20,
          vx: (Math.random() - 0.5) * 1.5, angle: 0, rotSpeed: 0.01,
          type: Math.random() < 0.4 ? 'breakable' : 'normal', hp: 2
        });
      }
    }

    function getValidRandomPos(margin) {
      let pos, dist;
      do {
        pos = { x: margin + Math.random() * (WIDTH - margin * 2), y: margin + Math.random() * (HEIGHT - margin * 2) };
        dist = Math.hypot(pos.x - CENTER.x, pos.y - CENTER.y);
      } while (dist < 150);
      return pos;
    }

    // Input
    canvas.addEventListener('mousedown', startDrag);
    canvas.addEventListener('mousemove', drag);
    canvas.addEventListener('mouseup', launch);

    function startDrag(e) {
      if (!isPlaying || ball.isLaunched) return;
      initAudio();
      const rect = canvas.getBoundingClientRect();
      if (Math.hypot(e.clientX - rect.left - ball.x, e.clientY - rect.top - ball.y) < ball.radius * 2.5) ball.isDragging = true;
    }

    function drag(e) {
      if (!ball.isDragging) return;
      const rect = canvas.getBoundingClientRect();
      const dx = e.clientX - rect.left - CENTER.x;
      const dy = e.clientY - rect.top - CENTER.y;
      const dist = Math.hypot(dx, dy);
      const maxDrag = 120;
      ball.x = dist > maxDrag ? CENTER.x + (dx / dist) * maxDrag : e.clientX - rect.left;
      ball.y = dist > maxDrag ? CENTER.y + (dy / dist) * maxDrag : e.clientY - rect.top;
    }

    function launch() {
      if (!ball.isDragging) return;
      ball.isDragging = false; ball.isLaunched = true;
      ball.launchTime = Date.now();
      ball.vx = (CENTER.x - ball.x) * 0.23;
      ball.vy = (CENTER.y - ball.y) * 0.23;
      playSound('launch');
    }

    function createAdvancedParticles(x, y, color, count = 12) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x, y, vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8,
          radius: Math.random() * 4 + 1, color, alpha: 1
        });
      }
    }

    function update() {
      if (!isPlaying) return;

      // Slow Mo & Shake Timers
      if (slowMoTimer > 0) { slowMoTimer -= 16; timeDilation = 0.3; } else timeDilation = 1;
      if (shakeTimer > 0) shakeTimer -= 16;

      const dt = timeDilation;

      if (ball.isLaunched) {
        const elapsedTime = Date.now() - ball.launchTime;
        timerEl.textContent = Math.max(0, (ball.maxFlightTime - elapsedTime) / 1000).toFixed(1);

        if (elapsedTime >= ball.maxFlightTime && !ball.isReturning) {
          ball.isReturning = true;
          if (ball.collectedCoinsThisLaunch === 0) {
            lives--; updateLivesUI();
            if (lives <= 0) {
              isPlaying = false; finalScoreEl.textContent = score;
              gameOverScreen.classList.remove('hidden'); return;
            }
          }
        }

        // Aplica Campo Gravitatorio
        gravityFields.forEach(g => {
          const dx = g.x - ball.x; const dy = g.y - ball.y;
          const dist = Math.hypot(dx, dy);
          if (dist < g.radius) {
            ball.vx += (dx / dist) * g.force * dt;
            ball.vy += (dy / dist) * g.force * dt;
          }
        });

        ball.x += ball.vx * dt; ball.y += ball.vy * dt;
        trail.push({ x: ball.x, y: ball.y, alpha: 1 });
        if (trail.length > 12) trail.shift();

        // Colisión con Bordes
        if (ball.x < ball.radius || ball.x > WIDTH - ball.radius) { ball.vx *= -0.9; playSound('bounce'); }
        if (ball.y < ball.radius || ball.y > HEIGHT - ball.radius) { ball.vy *= -0.9; playSound('bounce'); }

        // Colisión Bumpers estilo Pinball
        bumpers.forEach(b => {
          if (Math.hypot(ball.x - b.x, ball.y - b.y) < ball.radius + b.radius) {
            const angle = Math.atan2(ball.y - b.y, ball.x - b.x);
            ball.vx = Math.cos(angle) * 14; ball.vy = Math.sin(angle) * 14;
            shakeTimer = 200; createAdvancedParticles(b.x, b.y, '#ff007f', 15);
            playSound('bumper');
          }
        });

        // Láseres Temporizados
        lasers.forEach(l => {
          l.timer += 16;
          if (l.timer > 2000) { l.active = !l.active; l.timer = 0; }
          if (l.active) {
            const dist = Math.hypot(ball.x - l.x, ball.y - l.y);
            if (dist < l.length && dist < ball.radius + 5) {
              ball.isReturning = true; shakeTimer = 300; createAdvancedParticles(ball.x, ball.y, '#ff0055', 20);
            }
          }
        });

        // Monedas
        coins.forEach((c, i) => {
          if (Math.hypot(ball.x - c.x, ball.y - c.y) < ball.radius + c.radius) {
            coins.splice(i, 1); score += 20; scoreEl.textContent = score;
            localStorage.setItem('savedScore', score);
            createAdvancedParticles(c.x, c.y, '#ffe600', 10); playSound('coin');

            if (coins.length === 0) {
              slowMoTimer = 1000;
              setTimeout(() => {
                isPlaying = false; playSound('win');
                const remainingTime = (ball.maxFlightTime - elapsedTime) / 1000;
                const stars = remainingTime > 2.5 ? 3 : remainingTime > 1 ? 2 : 1;
                starRatingEl.textContent = '⭐'.repeat(stars);
                levelStars[currentLevel] = Math.max(levelStars[currentLevel] || 0, stars);
                localStorage.setItem('levelStars', JSON.stringify(levelStars));

                if (currentLevel >= unlockedLevels && unlockedLevels < TOTAL_LEVELS) {
                  unlockedLevels = currentLevel + 1;
                  localStorage.setItem('unlockedLevels', unlockedLevels);
                }
                victoryScreen.classList.remove('hidden');
              }, 500);
            }
          }
        });
      }

      // Actualizar Partículas
      particles.forEach((p, i) => {
        p.x += p.vx; p.y += p.vy; p.alpha -= 0.02;
        if (p.alpha <= 0) particles.splice(i, 1);
      });
    }

    function draw() {
      ctx.save();
      if (shakeTimer > 0) {
        ctx.translate((Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6);
      }

      ctx.clearRect(0, 0, WIDTH, HEIGHT);

      // Fondo
      ctx.strokeStyle = 'rgba(0, 240, 255, 0.04)'; ctx.lineWidth = 1;
      for (let i = 0; i < WIDTH; i += 40) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, HEIGHT); ctx.stroke(); }

      if (isPlaying) {
        // Campos Gravitatorios
        gravityFields.forEach(g => {
          ctx.beginPath(); ctx.arc(g.x, g.y, g.radius, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(150, 0, 255, 0.15)'; ctx.fill();
          ctx.strokeStyle = '#a000ff'; ctx.lineWidth = 2; ctx.stroke();
        });

        // Bumpers Pinball
        bumpers.forEach(b => {
          ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
          ctx.fillStyle = '#ff007f'; ctx.shadowColor = '#ff007f'; ctx.shadowBlur = 15; ctx.fill();
        });

        // Láseres Temporizados
        lasers.forEach(l => {
          if (l.active) {
            ctx.beginPath(); ctx.moveTo(l.x, l.y);
            ctx.lineTo(l.x + Math.cos(l.angle) * l.length, l.y + Math.sin(l.angle) * l.length);
            ctx.strokeStyle = '#ff0055'; ctx.lineWidth = 4; ctx.shadowColor = '#ff0055'; ctx.shadowBlur = 10; ctx.stroke();
          }
        });

        // Monedas
        ctx.fillStyle = '#ffe600'; ctx.shadowColor = '#ffe600'; ctx.shadowBlur = 10;
        coins.forEach(c => { ctx.beginPath(); ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2); ctx.fill(); });

        // Bola con Skin Seleccionada
        const skinColor = skins.find(s => s.id === selectedSkin)?.color || '#00f0ff';
        ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fillStyle = skinColor; ctx.shadowColor = skinColor; ctx.shadowBlur = 18; ctx.fill();

        // Partículas
        particles.forEach(p => {
          ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fillStyle = p.color; ctx.globalAlpha = p.alpha; ctx.fill(); ctx.globalAlpha = 1;
        });
      }
      ctx.restore();
    }

    function loop() { update(); draw(); requestAnimationFrame(loop); }

    showStartScreen();
    loop();
  </script>
</body>
</html>
