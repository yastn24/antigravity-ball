<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juego Neón Antigravedad - Modo Arcade Mejorado</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #05050d;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #00f0ff;
    }
    canvas {
      display: block;
      background: #08081a;
    }
    .hud {
      position: absolute;
      top: 15px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      font-size: 18px;
      font-weight: bold;
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.8);
    }
    .hud-box {
      background: rgba(10, 10, 30, 0.65);
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid rgba(0, 240, 255, 0.4);
    }
    .level-up-text {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      font-size: 42px;
      font-weight: 900;
      color: #ff007f;
      text-shadow: 0 0 20px #ff007f, 0 0 40px #00f0ff;
      pointer-events: none;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s;
      opacity: 0;
    }
    .level-up-text.show {
      transform: translate(-50%, -50%) scale(1.2);
      opacity: 1;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="hud">
      <div class="hud-box">PUNTOS: <span id="score">0</span></div>
      <div class="hud-box" style="color: #ff007f;">NIVEL: <span id="level">1</span></div>
      <div class="hud-box" style="color: #ffe600;">COMBO: <span id="combo">x1</span></div>
      <div class="hud-box" style="color: #00f0ff;">TIEMPO: <span id="timer">5.0</span>s</div>
    </div>
    <div id="level-msg" class="level-up-text">¡NIVEL COMPLETADO!</div>
    <canvas id="canvas" width="800" height="600"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const levelEl = document.getElementById('level');
    const comboEl = document.getElementById('combo');
    const timerEl = document.getElementById('timer');
    const levelMsg = document.getElementById('level-msg');

    const WIDTH = canvas.width;
    const HEIGHT = canvas.height;
    const CENTER = { x: WIDTH / 2, y: HEIGHT / 2 };

    // Estado del juego
    let score = 0;
    let level = 1;
    let currentCombo = 1;

    // Propiedades de la Bola
    const ball = {
      x: CENTER.x,
      y: CENTER.y,
      vx: 0,
      vy: 0,
      radius: 12,
      isDragging: false,
      isLaunched: false,
      isReturning: false,
      launchTime: 0,
      maxFlightTime: 5000 // 5 segundos de vuelo libre
    };

    // Arrays de objetos
    let obstacles = [];
    let coins = [];
    let blackHoles = [];
    let particles = [];
    let trail = [];

    // Web Audio API para Efectos de Sonido
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new AudioContext();
      }
    }

    function playSound(type) {
      if (!audioCtx) return;
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;

      if (type === 'launch') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
      } else if (type === 'coin') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, now); // C5
        osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
        osc.frequency.setValueAtTime(783.99, now + 0.16); // G5
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.start(now);
        osc.stop(now + 0.25);
      } else if (type === 'bounce') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(120, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.1);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
      } else if (type === 'return') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(150, now + 0.3);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
      }
    }

    // Inicializar elementos
    function initLevel() {
      coins = [];
      obstacles = [];
      blackHoles = [];

      // 1. Generar Monedas
      const numCoins = Math.min(5 + level, 12);
      for (let i = 0; i < numCoins; i++) {
        let pos = getValidRandomPos(30);
        coins.push({ x: pos.x, y: pos.y, radius: 10 });
      }

      // 2. Generar Obstáculos (con ángulos variados para rebotes impredecibles)
      const numObstacles = Math.min(3 + level, 8);
      for (let i = 0; i < numObstacles; i++) {
        let pos = getValidRandomPos(45);
        obstacles.push({
          x: pos.x,
          y: pos.y,
          w: 65 + Math.random() * 35,
          h: 18,
          vx: (Math.random() - 0.5) * (1 + level * 0.3),
          angle: (Math.random() - 0.5) * Math.PI * 0.4
        });
      }

      // 3. Generar Agujeros Negros
      if (level >= 2) {
        const numHoles = Math.min(Math.floor(level / 2), 3);
        for (let i = 0; i < numHoles; i++) {
          let pos = getValidRandomPos(60);
          blackHoles.push({ x: pos.x, y: pos.y, radius: 25, pullForce: 0.4 });
        }
      }
    }

    function getValidRandomPos(margin) {
      let pos;
      let dist;
      do {
        pos = {
          x: margin + Math.random() * (WIDTH - margin * 2),
          y: margin + Math.random() * (HEIGHT - margin * 2)
        };
        dist = Math.hypot(pos.x - CENTER.x, pos.y - CENTER.y);
      } while (dist < 130);
      return pos;
    }

    // Eventos
    canvas.addEventListener('mousedown', startDrag);
    canvas.addEventListener('mousemove', drag);
    canvas.addEventListener('mouseup', launch);

    canvas.addEventListener('touchstart', (e) => startDrag(e.touches[0]));
    canvas.addEventListener('touchmove', (e) => drag(e.touches[0]));
    canvas.addEventListener('touchend', launch);

    function startDrag(e) {
      initAudio();
      if (ball.isLaunched) return;
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;

      if (Math.hypot(mx - ball.x, my - ball.y) < ball.radius * 2.5) {
        ball.isDragging = true;
      }
    }

    function drag(e) {
      if (!ball.isDragging) return;
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;

      const dx = mx - CENTER.x;
      const dy = my - CENTER.y;
      const dist = Math.hypot(dx, dy);
      const maxDrag = 120;

      if (dist > maxDrag) {
        ball.x = CENTER.x + (dx / dist) * maxDrag;
        ball.y = CENTER.y + (dy / dist) * maxDrag;
      } else {
        ball.x = mx;
        ball.y = my;
      }
    }

    function launch() {
      if (!ball.isDragging) return;
      ball.isDragging = false;
      ball.isLaunched = true;
      ball.isReturning = false;
      ball.launchTime = Date.now();

      // Dirección opuesta al estiramiento
      const dx = CENTER.x - ball.x;
      const dy = CENTER.y - ball.y;
      
      const speedMultiplier = 0.22;
      ball.vx = dx * speedMultiplier;
      ball.vy = dy * speedMultiplier;

      // Desviación anti-línea para evitar trayectorias repetitivas
      if (Math.abs(ball.vx) < 0.5) ball.vx = (Math.random() > 0.5 ? 2 : -2);
      if (Math.abs(ball.vy) < 0.5) ball.vy = (Math.random() > 0.5 ? 2 : -2);

      currentCombo = 1;
      comboEl.textContent = `x${currentCombo}`;
      playSound('launch');
    }

    function createParticles(x, y, color, count = 10) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 7,
          vy: (Math.random() - 0.5) * 7,
          radius: Math.random() * 3 + 1,
          color,
          alpha: 1
        });
      }
    }

    // Actualización de física
    function update() {
      if (ball.isLaunched) {
        const elapsedTime = Date.now() - ball.launchTime;
        const remainingTime = Math.max(0, (ball.maxFlightTime - elapsedTime) / 1000);
        timerEl.textContent = remainingTime.toFixed(1);

        // Regreso al origen tras 5 segundos
        if (elapsedTime >= ball.maxFlightTime && !ball.isReturning) {
          ball.isReturning = true;
          playSound('return');
        }

        if (ball.isReturning) {
          const dx = CENTER.x - ball.x;
          const dy = CENTER.y - ball.y;
          const distToCenter = Math.hypot(dx, dy);

          ball.vx += (dx / distToCenter) * 0.8;
          ball.vy += (dy / distToCenter) * 0.8;

          ball.vx *= 0.95;
          ball.vy *= 0.95;

          if (distToCenter < 15) {
            ball.isLaunched = false;
            ball.isReturning = false;
            ball.x = CENTER.x;
            ball.y = CENTER.y;
            ball.vx = 0;
            ball.vy = 0;
            timerEl.textContent = "5.0";
          }
        } else {
          ball.vx *= 0.995;
          ball.vy *= 0.995;

          // Atracción de Agujeros Negros
          blackHoles.forEach(hole => {
            const hdx = hole.x - ball.x;
            const hdy = hole.y - ball.y;
            const hdist = Math.hypot(hdx, hdy);
            if (hdist < 160 && hdist > 5) {
              ball.vx += (hdx / hdist) * hole.pullForce;
              ball.vy += (hdy / hdist) * hole.pullForce;
            }
          });
        }

        // Mover Bola
        ball.x += ball.vx;
        ball.y += ball.vy;

        // Estela
        trail.push({ x: ball.x, y: ball.y, alpha: 1 });
        if (trail.length > 15) trail.shift();

        // Rebotes
        if (ball.x < ball.radius) {
          ball.x = ball.radius;
          ball.vx *= -0.9;
          playSound('bounce');
        } else if (ball.x > WIDTH - ball.radius) {
          ball.x = WIDTH - ball.radius;
          ball.vx *= -0.9;
          playSound('bounce');
        }

        if (ball.y < ball.radius) {
          ball.y = ball.radius;
          ball.vy *= -0.9;
          playSound('bounce');
        } else if (ball.y > HEIGHT - ball.radius) {
          ball.y = HEIGHT - ball.radius;
          ball.vy *= -0.9;
          playSound('bounce');
        }

        // Colisión con Monedas
        coins.forEach((coin, index) => {
          if (Math.hypot(ball.x - coin.x, ball.y - coin.y) < ball.radius + coin.radius) {
            coins.splice(index, 1);
            score += 10 * currentCombo;
            scoreEl.textContent = score;
            createParticles(coin.x, coin.y, '#ffe600', 12);
            playSound('coin');
            currentCombo++;
            comboEl.textContent = `x${currentCombo}`;

            if (coins.length === 0) {
              nextLevel();
            }
          }
        });

        // Colisión con Obstáculos
        obstacles.forEach(obs => {
          if (
            ball.x > obs.x - obs.w / 2 - ball.radius &&
            ball.x < obs.x + obs.w / 2 + ball.radius &&
            ball.y > obs.y - obs.h / 2 - ball.radius &&
            ball.y < obs.y + obs.h / 2 + ball.radius
          ) {
            ball.vx = -ball.vx * 0.85 + (Math.random() - 0.5) * 2;
            ball.vy = -ball.vy * 0.85 + (Math.random() - 0.5) * 2;
            createParticles(ball.x, ball.y, '#ff0055', 8);
            playSound('bounce');
          }
        });
      } else {
        timerEl.textContent = "5.0";
      }

      // Mover Obstáculos dinámicos
      obstacles.forEach(obs => {
        obs.x += obs.vx;
        if (obs.x < obs.w / 2 || obs.x > WIDTH - obs.w / 2) obs.vx *= -1;
      });

      // Partículas
      particles.forEach((p, i) => {
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.025;
        if (p.alpha <= 0) particles.splice(i, 1);
      });
    }

    // Cambio de Nivel
    function nextLevel() {
      level++;
      levelEl.textContent = level;
      levelMsg.classList.add('show');
      setTimeout(() => levelMsg.classList.remove('show'), 1200);

      ball.isLaunched = false;
      ball.isReturning = false;
      ball.x = CENTER.x;
      ball.y = CENTER.y;
      ball.vx = 0;
      ball.vy = 0;

      initLevel();
    }

    // Renderizado
    function draw() {
      ctx.clearRect(0, 0, WIDTH, HEIGHT);

      // Fondo
      ctx.strokeStyle = 'rgba(0, 240, 255, 0.05)';
      ctx.lineWidth = 1;
      for (let i = 0; i < WIDTH; i += 40) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, HEIGHT); ctx.stroke();
      }
      for (let j = 0; j < HEIGHT; j += 40) {
        ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(WIDTH, j); ctx.stroke();
      }

      // Base Central
      ctx.beginPath();
      ctx.arc(CENTER.x, CENTER.y, 22, 0, Math.PI * 2);
      ctx.strokeStyle = ball.isReturning ? '#ff007f' : '#00f0ff';
      ctx.lineWidth = 2;
      ctx.shadowBlur = 15;
      ctx.shadowColor = ball.isReturning ? '#ff007f' : '#00f0ff';
      ctx.stroke();

      // Agujeros Negros
      blackHoles.forEach(hole => {
        ctx.beginPath();
        ctx.arc(hole.x, hole.y, hole.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#000';
        ctx.strokeStyle = '#7928ca';
        ctx.lineWidth = 4;
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#7928ca';
        ctx.fill();
        ctx.stroke();
      });

      // Obstáculos
      ctx.fillStyle = '#ff0055';
      ctx.shadowColor = '#ff0055';
      ctx.shadowBlur = 12;
      obstacles.forEach(obs => {
        ctx.save();
        ctx.translate(obs.x, obs.y);
        ctx.rotate(obs.angle);
        ctx.fillRect(-obs.w / 2, -obs.h / 2, obs.w, obs.h);
        ctx.restore();
      });

      // Monedas
      ctx.fillStyle = '#ffe600';
      ctx.shadowColor = '#ffe600';
      ctx.shadowBlur = 10;
      coins.forEach(coin => {
        ctx.beginPath();
        ctx.arc(coin.x, coin.y, coin.radius, 0, Math.PI * 2);
        ctx.fill();
      });

      // Resorte
      if (ball.isDragging) {
        ctx.beginPath();
        ctx.moveTo(CENTER.x, CENTER.y);
        ctx.lineTo(ball.x, ball.y);
        ctx.strokeStyle = '#ff007f';
        ctx.lineWidth = 3;
        ctx.shadowColor = '#ff007f';
        ctx.shadowBlur = 12;
        ctx.stroke();
      }

      // Estela
      trail.forEach(t => {
        ctx.beginPath();
        ctx.arc(t.x, t.y, ball.radius * 0.6, 0, Math.PI * 2);
        ctx.fillStyle = ball.isReturning ? `rgba(255, 0, 127, ${t.alpha})` : `rgba(0, 240, 255, ${t.alpha})`;
        ctx.shadowBlur = 0;
        ctx.fill();
        t.alpha -= 0.06;
      });

      // Bola
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fillStyle = ball.isReturning ? '#ff007f' : '#00f0ff';
      ctx.shadowColor = ball.isReturning ? '#ff007f' : '#00f0ff';
      ctx.shadowBlur = 15;
      ctx.fill();

      // Partículas
      particles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.alpha;
        ctx.fill();
        ctx.globalAlpha = 1;
      });
    }

    // Bucle
    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    initLevel();
    loop();
  </script>
</body>
</html>
