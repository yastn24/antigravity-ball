<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Juego de Antigravedad - Partículas y Monedas</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #0d1117;
      color: #f0f6fc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    header {
      text-align: center;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 1.5rem;
      color: #58a6ff;
    }
    .score-board {
      font-size: 1.2rem;
      color: #e3b341;
      font-weight: bold;
      margin-top: 4px;
    }
    #canvas-container {
      position: relative;
      border: 2px solid #30363d;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      background-color: #161b22;
    }
    canvas {
      display: block;
      cursor: crosshair;
    }
    .controls {
      margin-top: 12px;
      display: flex;
      gap: 15px;
      align-items: center;
      background: #21262d;
      padding: 8px 16px;
      border-radius: 8px;
    }
    label {
      font-size: 0.85rem;
      color: #c9d1d9;
    }
    input[type="range"] {
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>Física de Antigravedad</h1>
    <p>¡Recolecta las monedas doradas evitando los obstáculos!</p>
    <div class="score-board">PUNTOS: <span id="scoreText">0</span></div>
  </header>

  <div id="canvas-container">
    <canvas id="gameCanvas" width="800" height="500"></canvas>
  </div>

  <div class="controls">
    <label>
      Fuerza de Retorno:
      <input type="range" id="gravitySlider" min="0.01" max="0.15" step="0.005" value="0.04" />
    </label>
    <label>
      Fricción (Aire):
      <input type="range" id="frictionSlider" min="0.95" max="0.999" step="0.001" value="0.985" />
    </label>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const gravitySlider = document.getElementById('gravitySlider');
    const frictionSlider = document.getElementById('frictionSlider');
    const scoreText = document.getElementById('scoreText');

    let score = 0;

    // Punto de origen fijo
    const origin = { x: canvas.width / 2, y: canvas.height / 2 };

    // Propiedades de la bola
    const ball = {
      x: origin.x,
      y: origin.y,
      vx: 0,
      vy: 0,
      radius: 14,
      isDragging: false,
      isLaunched: false
    };

    let dragPos = { x: origin.x, y: origin.y };

    // Arreglos para efectos visuales (Estela y explosión de partículas)
    let trail = [];
    let particles = [];

    // Lista de obstáculos
    const obstacles = [
      { x: 220, y: 150, w: 40, h: 200 },
      { x: 540, y: 150, w: 40, h: 200 },
      { x: 320, y: 80,  w: 160, h: 30 },
      { x: 320, y: 390, w: 160, h: 30 }
    ];

    // Monedas coleccionables
    let coins = [];

    function spawnCoins() {
      coins = [
        { x: 150, y: 120, radius: 10, collected: false },
        { x: 650, y: 120, radius: 10, collected: false },
        { x: 150, y: 380, radius: 10, collected: false },
        { x: 650, y: 380, radius: 10, collected: false },
        { x: 400, y: 50,  radius: 10, collected: false },
        { x: 400, y: 450, radius: 10, collected: false }
      ];
    }
    spawnCoins();

    // Crear estallido de partículas (al agarrar moneda o chocar)
    function createExplosion(x, y, color, count = 12) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4 + 1;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          color: color,
          alpha: 1,
          size: Math.random() * 4 + 2
        });
      }
    }

    // Controles de Ratón
    canvas.addEventListener('mousedown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      const dist = Math.hypot(mouseX - ball.x, mouseY - ball.y);
      if (dist <= ball.radius + 10) {
        ball.isDragging = true;
        ball.isLaunched = false;
        ball.vx = 0;
        ball.vy = 0;
        dragPos.x = mouseX;
        dragPos.y = mouseY;
        trail = [];
      }
    });

    canvas.addEventListener('mousemove', (e) => {
      if (ball.isDragging) {
        const rect = canvas.getBoundingClientRect();
        dragPos.x = e.clientX - rect.left;
        dragPos.y = e.clientY - rect.top;
      }
    });

    window.addEventListener('mouseup', () => {
      if (ball.isDragging) {
        ball.isDragging = false;
        ball.isLaunched = true;
        ball.vx = (origin.x - dragPos.x) * 0.15;
        ball.vy = (origin.y - dragPos.y) * 0.15;
      }
    });

    // Colisión Bola vs Obstáculo
    function checkObstacleCollision(obs) {
      const closestX = Math.max(obs.x, Math.min(ball.x, obs.x + obs.w));
      const closestY = Math.max(obs.y, Math.min(ball.y, obs.y + obs.h));

      const dx = ball.x - closestX;
      const dy = ball.y - closestY;
      const distance = Math.hypot(dx, dy);

      if (distance < ball.radius) {
        const overlapX = ball.radius - Math.abs(dx);
        const overlapY = ball.radius - Math.abs(dy);

        if (overlapX < overlapY) {
          ball.vx *= -0.8;
          ball.x += dx > 0 ? overlapX : -overlapX;
        } else {
          ball.vy *= -0.8;
          ball.y += dy > 0 ? overlapY : -overlapY;
        }
        createExplosion(closestX, closestY, '#58a6ff', 6);
      }
    }

    // Colisión Bola vs Monedas
    function checkCoinCollision() {
      coins.forEach(coin => {
        if (!coin.collected) {
          const dist = Math.hypot(ball.x - coin.x, ball.y - coin.y);
          if (dist < ball.radius + coin.radius) {
            coin.collected = true;
            score += 100;
            scoreText.textContent = score;
            createExplosion(coin.x, coin.y, '#f1e05a', 15);
          }
        }
      });

      if (coins.every(c => c.collected)) {
        setTimeout(spawnCoins, 1000);
      }
    }

    function update() {
      const returnForce = parseFloat(gravitySlider.value);
      const friction = parseFloat(frictionSlider.value);

      if (ball.isLaunched) {
        // Guardar posición para la estela de neón
        trail.push({ x: ball.x, y: ball.y, alpha: 1.0 });
        if (trail.length > 20) trail.shift();

        // Fuerza de antigravedad
        const dx = origin.x - ball.x;
        const dy = origin.y - ball.y;
        const distance = Math.hypot(dx, dy);

        if (distance > 1) {
          ball.vx += (dx / distance) * (distance * returnForce * 0.1);
          ball.vy += (dy / distance) * (distance * returnForce * 0.1);
        }

        ball.vx *= friction;
        ball.vy *= friction;

        ball.x += ball.vx;
        ball.y += ball.vy;

        // Rebotar con bordes de la pantalla
        if (ball.x - ball.radius < 0 || ball.x + ball.radius > canvas.width) {
          ball.vx *= -0.8;
          createExplosion(ball.x, ball.y, '#388bfd', 5);
        }
        if (ball.y - ball.radius < 0 || ball.y + ball.radius > canvas.height) {
          ball.vy *= -0.8;
          createExplosion(ball.x, ball.y, '#388bfd', 5);
        }

        obstacles.forEach(checkObstacleCollision);
        checkCoinCollision();

        // Detener al volver al origen
        if (distance < 4 && Math.hypot(ball.vx, ball.vy) < 0.3) {
          ball.x = origin.x;
          ball.y = origin.y;
          ball.vx = 0;
          ball.vy = 0;
          ball.isLaunched = false;
          trail = [];
          createExplosion(origin.x, origin.y, '#f85149', 10);
        }
      }

      // Desvanecer estela
      trail.forEach(t => t.alpha -= 0.04);
      trail = trail.filter(t => t.alpha > 0);

      // Actualizar partículas
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.02;
      });
      particles = particles.filter(p => p.alpha > 0);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. Dibujar Punto de Origen
      ctx.beginPath();
      ctx.arc(origin.x, origin.y, 6, 0, Math.PI * 2);
      ctx.fillStyle = '#f85149';
      ctx.shadowColor = '#f85149';
      ctx.shadowBlur = 8;
      ctx.fill();
      ctx.shadowBlur = 0;

      // 2. Dibujar Obstáculos
      ctx.fillStyle = '#238636';
      ctx.strokeStyle = '#2ea043';
      ctx.lineWidth = 2;
      obstacles.forEach(obs => {
        ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
        ctx.strokeRect(obs.x, obs.y, obs.w, obs.h);
      });

      // 3. Dibujar Monedas
      coins.forEach(coin => {
        if (!coin.collected) {
          ctx.beginPath();
          ctx.arc(coin.x, coin.y, coin.radius, 0, Math.PI * 2);
          ctx.fillStyle = '#f1e05a';
          ctx.shadowColor = '#f1e05a';
          ctx.shadowBlur = 10;
          ctx.fill();
          ctx.shadowBlur = 0;
        }
      });

      // 4. Dibujar Estela de Neón de la Bola
      for (let i = 0; i < trail.length; i++) {
        const point = trail[i];
        ctx.beginPath();
        ctx.arc(point.x, point.y, ball.radius * (i / trail.length), 0, Math.PI * 2);
        ctx.fillStyle = `rgba(88, 166, 255, ${point.alpha * 0.4})`;
        ctx.fill();
      }

      // 5. Dibujar Partículas de Explosiones
      particles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.fill();
        ctx.globalAlpha = 1.0;
      });

      // 6. Línea de Lanzamiento
      if (ball.isDragging) {
        ctx.beginPath();
        ctx.moveTo(origin.x, origin.y);
        ctx.lineTo(dragPos.x, dragPos.y);
        ctx.strokeStyle = '#58a6ff';
        ctx.lineWidth = 3;
        ctx.setLineDash([6, 6]);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // 7. Vector de Retorno
      if (ball.isLaunched) {
        ctx.beginPath();
        ctx.moveTo(ball.x, ball.y);
        ctx.lineTo(origin.x, origin.y);
        ctx.strokeStyle = 'rgba(88, 166, 255, 0.2)';
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      // 8. Dibujar la Bola Principales con resplandor
      ctx.beginPath();
      const currentX = ball.isDragging ? dragPos.x : ball.x;
      const currentY = ball.isDragging ? dragPos.y : ball.y;
      ctx.arc(currentX, currentY, ball.radius, 0, Math.PI * 2);
      ctx.fillStyle = ball.isDragging ? '#79c0ff' : '#a5d6ff';
      ctx.shadowColor = '#58a6ff';
      ctx.shadowBlur = 12;
      ctx.fill();
      ctx.strokeStyle = '#388bfd';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
