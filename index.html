<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juego Neón Antigravedad - Edición Expandida</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #05050d;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      box-shadow: 0 0 40px rgba(0, 240, 255, 0.4);
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #00f0ff;
    }
    canvas { display: block; background: #08081a; }
    
    .hud {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      font-size: 15px;
      font-weight: bold;
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.8);
      z-index: 5;
    }
    .hud-box {
      background: rgba(10, 10, 30, 0.85);
      padding: 6px 14px;
      border-radius: 18px;
      border: 1px solid rgba(0, 240, 255, 0.4);
    }

    .overlay-screen {
      position: absolute;
      inset: 0;
      background: rgba(5, 5, 15, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: opacity 0.3s ease;
    }
    .hidden { display: none !important; }

    h1 {
      font-size: 42px;
      color: #00f0ff;
      text-shadow: 0 0 20px #00f0ff, 0 0 40px #ff007f;
      margin-bottom: 10px;
      text-align: center;
    }
    p { font-size: 16px; color: #aaa; margin-bottom: 20px; text-align: center; }

    .btn {
      background: #00f0ff;
      color: #05050d;
      border: none;
      padding: 12px 30px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 0 15px #00f0ff;
      transition: transform 0.2s, background 0.2s, color 0.2s;
      margin: 8px;
    }
    .btn:hover {
      transform: scale(1.08);
      background: #ff007f;
      color: #fff;
      box-shadow: 0 0 20px #ff007f;
    }

    .levels-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      margin: 20px 0;
      max-width: 80%;
    }
    .level-btn {
      width: 55px;
      height: 55px;
      border-radius: 12px;
      border: 2px solid #00f0ff;
      background: rgba(0, 240, 255, 0.1);
      color: #00f0ff;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
      transition: all 0.2s;
    }
    .level-btn:hover:not(.locked) {
      background: #00f0ff;
      color: #000;
      box-shadow: 0 0 15px #00f0ff;
    }
    .level-btn.locked {
      border-color: #444;
      color: #444;
      background: rgba(20, 20, 30, 0.5);
      cursor: not-allowed;
      box-shadow: none;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="hud">
      <div class="hud-box">NIVEL: <span id="level-display">1</span></div>
      <div class="hud-box">PUNTOS: <span id="score">0</span></div>
      <div class="hud-box" style="color: #ff007f;">VIDAS: <span id="lives">❤️❤️❤️</span></div>
      <div class="hud-box" style="color: #00f0ff;">TIEMPO: <span id="timer">5.0</span>s</div>
    </div>

    <!-- Pantallas -->
    <div id="start-screen" class="overlay-screen">
      <h1>NEÓN ANTIGRAVEDAD</h1>
      <p>Esquiva muros giratorios, usa escudos e imanes y atrapa todas las monedas.</p>
      <button class="btn" onclick="showLevelSelect()">JUGAR</button>
    </div>

    <div id="level-select-screen" class="overlay-screen hidden">
      <h1>SELECCIONAR NIVEL</h1>
      <div class="levels-grid" id="levels-container"></div>
      <button class="btn" style="padding: 8px 20px; font-size: 14px;" onclick="showStartScreen()">VOLVER</button>
    </div>

    <div id="game-over-screen" class="overlay-screen hidden">
      <h1 style="color: #ff0055; text-shadow: 0 0 20px #ff0055;">¡GAME OVER!</h1>
      <p>Puntuación Final: <span id="final-score">0</span></p>
      <button class="btn" onclick="retryLevel()">Reintentar</button>
      <button class="btn" onclick="showLevelSelect()">Menú de Niveles</button>
    </div>

    <div id="victory-screen" class="overlay-screen hidden">
      <h1>¡NIVEL COMPLETADO!</h1>
      <p>¡Lanzamiento magistral!</p>
      <button class="btn" onclick="loadNextLevel()">Siguiente Nivel</button>
      <button class="btn" onclick="showLevelSelect()">Seleccionar Nivel</button>
    </div>

    <canvas id="canvas" width="1000" height="700"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const timerEl = document.getElementById('timer');
    const levelDisplayEl = document.getElementById('level-display');
    const finalScoreEl = document.getElementById('final-score');

    const startScreen = document.getElementById('start-screen');
    const levelSelectScreen = document.getElementById('level-select-screen');
    const gameOverScreen = document.getElementById('game-over-screen');
    const victoryScreen = document.getElementById('victory-screen');
    const levelsContainer = document.getElementById('levels-container');

    const WIDTH = canvas.width;
    const HEIGHT = canvas.height;
    const CENTER = { x: WIDTH / 2, y: HEIGHT / 2 };

    const TOTAL_LEVELS = 10;
    let unlockedLevels = parseInt(localStorage.getItem('unlockedLevels')) || 1;

    let score = 0;
    let currentLevel = 1;
    let lives = 3;
    let isPlaying = false;

    const ball = {
      x: CENTER.x,
      y: CENTER.y,
      vx: 0,
      vy: 0,
      radius: 12,
      isDragging: false,
      isLaunched: false,
      isReturning: false,
      launchTime: 0,
      returnStartTime: 0,
      maxFlightTime: 5000,
      collectedCoinsThisLaunch: 0,
      magnetActive: false,
      magnetTimer: 0,
      shieldActive: false
    };

    const MAGNET_CONFIG = { durationMs: 2500, range: 160, pullSpeed: 6 };

    let obstacles = [];
    let coins = [];
    let powerups = []; // tipo: 'magnet', 'shield', 'time'
    let portals = [];
    let particles = [];
    let trail = [];

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioContext();
    }

    function playSound(type) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'launch') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);
        gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc.start(now); osc.stop(now + 0.15);
      } else if (type === 'coin') {
        osc.type = 'triangle'; osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.08);
        gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.start(now); osc.stop(now + 0.2);
      } else if (type === 'bounce') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(45, now + 0.06);
        gain.gain.setValueAtTime(0.12, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
        osc.start(now); osc.stop(now + 0.06);
      } else if (type === 'boost') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + 0.2);
        gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.start(now); osc.stop(now + 0.2);
      } else if (type === 'powerup') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(440, now);
        osc.frequency.setValueAtTime(880, now + 0.15);
        gain.gain.setValueAtTime(0.25, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc.start(now); osc.stop(now + 0.15);
      } else if (type === 'win') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(440, now);
        osc.frequency.setValueAtTime(880, now + 0.2);
        gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
      }
    }

    // UI & Screens
    function hideAllScreens() {
      startScreen.classList.add('hidden');
      levelSelectScreen.classList.add('hidden');
      gameOverScreen.classList.add('hidden');
      victoryScreen.classList.add('hidden');
    }

    function showStartScreen() {
      hideAllScreens();
      startScreen.classList.remove('hidden');
      isPlaying = false;
    }

    function showLevelSelect() {
      hideAllScreens();
      renderLevelButtons();
      levelSelectScreen.classList.remove('hidden');
      isPlaying = false;
    }

    function renderLevelButtons() {
      levelsContainer.innerHTML = '';
      for (let i = 1; i <= TOTAL_LEVELS; i++) {
        const btn = document.createElement('button');
        btn.className = `level-btn ${i > unlockedLevels ? 'locked' : ''}`;
        btn.textContent = i > unlockedLevels ? '🔒' : i;
        if (i <= unlockedLevels) btn.onclick = () => startLevel(i);
        levelsContainer.appendChild(btn);
      }
    }

    function startLevel(lvl) {
      currentLevel = lvl;
      levelDisplayEl.textContent = currentLevel;
      lives = 3;
      updateLivesUI();
      hideAllScreens();
      resetBallToCenter();
      initLevelData();
      isPlaying = true;
    }

    function retryLevel() { startLevel(currentLevel); }
    function loadNextLevel() {
      if (currentLevel < TOTAL_LEVELS) startLevel(currentLevel + 1);
      else showLevelSelect();
    }

    function updateLivesUI() { livesEl.textContent = '❤️'.repeat(Math.max(0, lives)); }

    function resetBallToCenter() {
      ball.isLaunched = false;
      ball.isReturning = false;
      ball.x = CENTER.x;
      ball.y = CENTER.y;
      ball.vx = 0; ball.vy = 0;
      ball.shieldActive = false;
      ball.magnetActive = false;
      ball.maxFlightTime = 5000;
      timerEl.textContent = "5.0";
    }

    function initLevelData() {
      coins = []; obstacles = []; powerups = []; portals = [];

      const numCoins = Math.min(5 + currentLevel, 14);
      for (let i = 0; i < numCoins; i++) {
        let pos = getValidRandomPos(40);
        coins.push({ x: pos.x, y: pos.y, radius: 10 });
      }

      const numObstacles = Math.min(3 + currentLevel, 10);
      for (let i = 0; i < numObstacles; i++) {
        let pos = getValidRandomPos(60);
        let randType = Math.random();
        let obsType = 'normal';
        if (randType < 0.3) obsType = 'breakable';
        else if (randType < 0.6) obsType = 'bouncy'; // Muro de súper rebote

        obstacles.push({
          x: pos.x, y: pos.y,
          w: 80 + Math.random() * 40, h: 22,
          vx: (Math.random() - 0.5) * (1.2 + currentLevel * 0.3),
          angle: (Math.random() - 0.5) * Math.PI * 0.5,
          rotSpeed: (Math.random() < 0.5 ? 1 : -1) * (0.005 + Math.random() * 0.015), // Rotación dinámica
          type: obsType,
          hp: obsType === 'breakable' ? 2 : Infinity
        });
      }

      if (currentLevel >= 2) {
        let pos1 = getValidRandomPos(70);
        let pos2 = getValidRandomPos(70);
        portals = [
          { x: pos1.x, y: pos1.y, radius: 24, color: '#00ff66', cooldown: 0 },
          { x: pos2.x, y: pos2.y, radius: 24, color: '#ff00ee', cooldown: 0 }
        ];
      }

      // Generar Power-ups aleatorios
      const pTypes = ['magnet', 'shield', 'time'];
      for (let i = 0; i < 2; i++) {
        if (Math.random() < 0.7) {
          let pos = getValidRandomPos(50);
          powerups.push({
            x: pos.x, y: pos.y, radius: 15,
            type: pTypes[Math.floor(Math.random() * pTypes.length)]
          });
        }
      }
    }

    function getValidRandomPos(margin) {
      let pos, dist;
      do {
        pos = {
          x: margin + Math.random() * (WIDTH - margin * 2),
          y: margin + Math.random() * (HEIGHT - margin * 2)
        };
        dist = Math.hypot(pos.x - CENTER.x, pos.y - CENTER.y);
      } while (dist < 150);
      return pos;
    }

    // Input
    canvas.addEventListener('mousedown', startDrag);
    canvas.addEventListener('mousemove', drag);
    canvas.addEventListener('mouseup', launch);
    canvas.addEventListener('touchstart', (e) => startDrag(e.touches[0]));
    canvas.addEventListener('touchmove', (e) => drag(e.touches[0]));
    canvas.addEventListener('touchend', launch);

    function startDrag(e) {
      if (!isPlaying || ball.isLaunched) return;
      initAudio();
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      if (Math.hypot(mx - ball.x, my - ball.y) < ball.radius * 2.5) ball.isDragging = true;
    }

    function drag(e) {
      if (!ball.isDragging) return;
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      const dx = mx - CENTER.x;
      const dy = my - CENTER.y;
      const dist = Math.hypot(dx, dy);
      const maxDrag = 130;

      if (dist > maxDrag) {
        ball.x = CENTER.x + (dx / dist) * maxDrag;
        ball.y = CENTER.y + (dy / dist) * maxDrag;
      } else {
        ball.x = mx; ball.y = my;
      }
    }

    function launch() {
      if (!ball.isDragging) return;
      ball.isDragging = false;
      ball.isLaunched = true;
      ball.isReturning = false;
      ball.launchTime = Date.now();
      ball.collectedCoinsThisLaunch = 0;

      const dx = CENTER.x - ball.x;
      const dy = CENTER.y - ball.y;
      ball.vx = dx * 0.23;
      ball.vy = dy * 0.23;
      playSound('launch');
    }

    function checkOBBCollision(ball, obs) {
      const relX = ball.x - obs.x;
      const relY = ball.y - obs.y;
      const cos = Math.cos(-obs.angle);
      const sin = Math.sin(-obs.angle);
      const localX = relX * cos - relY * sin;
      const localY = relX * sin + relY * cos;
      const localVx = ball.vx * cos - ball.vy * sin;
      const localVy = ball.vx * sin + ball.vy * cos;

      const halfW = obs.w / 2;
      const halfH = obs.h / 2;
      const closestX = Math.max(-halfW, Math.min(halfW, localX));
      const closestY = Math.max(-halfH, Math.min(halfH, localY));
      const distX = localX - closestX;
      const distY = localY - closestY;
      const distance = Math.hypot(distX, distY);

      if (distance < ball.radius) {
        const bounceFactor = obs.type === 'bouncy' ? 1.6 : 0.85;
        let newLocalVx = localVx;
        let newLocalVy = localVy;

        if (Math.abs(localX - closestX) > Math.abs(localY - closestY)) {
          newLocalVx = -localVx * bounceFactor;
        } else {
          newLocalVy = -localVy * bounceFactor;
        }

        const cosBack = Math.cos(obs.angle);
        const sinBack = Math.sin(obs.angle);
        ball.vx = newLocalVx * cosBack - newLocalVy * sinBack;
        ball.vy = newLocalVx * sinBack + newLocalVy * cosBack;

        return true;
      }
      return false;
    }

    function update() {
      if (!isPlaying) return;

      if (ball.magnetActive) {
        ball.magnetTimer -= 16;
        if (ball.magnetTimer <= 0) ball.magnetActive = false;
      }

      portals.forEach(p => { if (p.cooldown > 0) p.cooldown -= 16; });

      if (ball.isLaunched) {
        const elapsedTime = Date.now() - ball.launchTime;
        const remainingTime = Math.max(0, (ball.maxFlightTime - elapsedTime) / 1000);
        timerEl.textContent = remainingTime.toFixed(1);

        if (elapsedTime >= ball.maxFlightTime && !ball.isReturning) {
          ball.isReturning = true;
          ball.returnStartTime = Date.now();

          if (ball.collectedCoinsThisLaunch === 0) {
            lives--;
            updateLivesUI();
            if (lives <= 0) {
              isPlaying = false;
              finalScoreEl.textContent = score;
              gameOverScreen.classList.remove('hidden');
              return;
            }
          }
        }

        if (ball.isReturning) {
          const dx = CENTER.x - ball.x;
          const dy = CENTER.y - ball.y;
          const distToCenter = Math.hypot(dx, dy);

          if (Date.now() - ball.returnStartTime >= 3000) { resetBallToCenter(); return; }

          ball.vx += (dx / distToCenter) * 0.85;
          ball.vy += (dy / distToCenter) * 0.85;
          ball.vx *= 0.94; ball.vy *= 0.94;

          if (distToCenter < 15) resetBallToCenter();
        } else {
          ball.vx *= 0.995; ball.vy *= 0.995;
        }

        ball.x += ball.vx;
        ball.y += ball.vy;

        trail.push({ x: ball.x, y: ball.y, alpha: 1 });
        if (trail.length > 15) trail.shift();

        // Colisión bordes
        if (ball.x < ball.radius) { ball.x = ball.radius; ball.vx *= -0.9; playSound('bounce'); }
        else if (ball.x > WIDTH - ball.radius) { ball.x = WIDTH - ball.radius; ball.vx *= -0.9; playSound('bounce'); }
        if (ball.y < ball.radius) { ball.y = ball.radius; ball.vy *= -0.9; playSound('bounce'); }
        else if (ball.y > HEIGHT - ball.radius) { ball.y = HEIGHT - ball.radius; ball.vy *= -0.9; playSound('bounce'); }

        // Recoger Monedas
        coins.forEach((coin, index) => {
          if (ball.magnetActive) {
            const mdx = ball.x - coin.x;
            const mdy = ball.y - coin.y;
            const mdist = Math.hypot(mdx, mdy);
            if (mdist <= MAGNET_CONFIG.range && mdist > 5) {
              coin.x += (mdx / mdist) * MAGNET_CONFIG.pullSpeed;
              coin.y += (mdy / mdist) * MAGNET_CONFIG.pullSpeed;
            }
          }

          if (Math.hypot(ball.x - coin.x, ball.y - coin.y) < ball.radius + coin.radius) {
            coins.splice(index, 1);
            score += 15;
            scoreEl.textContent = score;
            ball.collectedCoinsThisLaunch++;
            playSound('coin');

            if (coins.length === 0) {
              isPlaying = false;
              playSound('win');
              if (currentLevel >= unlockedLevels && unlockedLevels < TOTAL_LEVELS) {
                unlockedLevels = currentLevel + 1;
                localStorage.setItem('unlockedLevels', unlockedLevels);
              }
              victoryScreen.classList.remove('hidden');
            }
          }
        });

        // Recoger Power-ups
        powerups.forEach((p, index) => {
          if (Math.hypot(ball.x - p.x, ball.y - p.y) < ball.radius + p.radius) {
            if (p.type === 'magnet') {
              ball.magnetActive = true;
              ball.magnetTimer = MAGNET_CONFIG.durationMs;
            } else if (p.type === 'shield') {
              ball.shieldActive = true;
            } else if (p.type === 'time') {
              ball.maxFlightTime += 3000;
            }
            powerups.splice(index, 1);
            playSound('powerup');
          }
        });

        // Portales
        if (portals.length === 2 && portals[0].cooldown <= 0 && portals[1].cooldown <= 0) {
          portals.forEach((p, idx) => {
            if (Math.hypot(ball.x - p.x, ball.y - p.y) < ball.radius + p.radius) {
              const other = portals[1 - idx];
              ball.x = other.x; ball.y = other.y;
              portals[0].cooldown = 400; portals[1].cooldown = 400;
              playSound('portal');
            }
          });
        }

        // Colisión Muros
        obstacles.forEach((obs, index) => {
          if (checkOBBCollision(ball, obs)) {
            if (ball.shieldActive) {
              ball.shieldActive = false; // Escudo destruye la resistencia o protege
              if (obs.type === 'breakable') obstacles.splice(index, 1);
              playSound('bounce');
            } else if (obs.type === 'breakable') {
              obs.hp--;
              playSound('bounce');
              if (obs.hp <= 0) obstacles.splice(index, 1);
            } else if (obs.type === 'bouncy') {
              playSound('boost');
            } else {
              playSound('bounce');
            }
          }
        });
      }

      // Mover y Girar Muros
      obstacles.forEach(obs => {
        obs.x += obs.vx;
        obs.angle += obs.rotSpeed; // Rotación continua
        if (obs.x < obs.w / 2 || obs.x > WIDTH - obs.w / 2) obs.vx *= -1;
      });
    }

    function draw() {
      ctx.clearRect(0, 0, WIDTH, HEIGHT);

      // Fondo
      ctx.strokeStyle = 'rgba(0, 240, 255, 0.04)';
      ctx.lineWidth = 1;
      for (let i = 0; i < WIDTH; i += 40) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, HEIGHT); ctx.stroke(); }
      for (let j = 0; j < HEIGHT; j += 40) { ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(WIDTH, j); ctx.stroke(); }

      if (isPlaying) {
        // Base
        ctx.beginPath();
        ctx.arc(CENTER.x, CENTER.y, 22, 0, Math.PI * 2);
        ctx.strokeStyle = ball.isReturning ? '#ff007f' : '#00f0ff';
        ctx.lineWidth = 2; ctx.stroke();

        // Portales
        portals.forEach(p => {
          ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.strokeStyle = p.color; ctx.lineWidth = 3; ctx.stroke();
        });

        // Muros Dinámicos
        obstacles.forEach(obs => {
          ctx.save();
          ctx.translate(obs.x, obs.y);
          ctx.rotate(obs.angle);
          
          if (obs.type === 'bouncy') {
            ctx.fillStyle = '#ffea00'; // Muro de impulso (Amarillo Neón)
            ctx.shadowColor = '#ffea00'; ctx.shadowBlur = 10;
          } else if (obs.type === 'breakable') {
            ctx.fillStyle = 'rgba(0, 229, 255, 0.6)';
            ctx.shadowColor = '#00e5ff'; ctx.shadowBlur = 8;
          } else {
            ctx.fillStyle = '#ff0055';
            ctx.shadowColor = '#ff0055'; ctx.shadowBlur = 8;
          }
          
          ctx.fillRect(-obs.w / 2, -obs.h / 2, obs.w, obs.h);
          ctx.restore();
        });

        // Power-ups
        powerups.forEach(p => {
          ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fillStyle = p.type === 'magnet' ? '#00f0ff' : p.type === 'shield' ? '#00ff66' : '#ff00ee';
          ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 12; ctx.fill();
          
          ctx.fillStyle = '#000'; ctx.font = 'bold 12px sans-serif';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(p.type === 'magnet' ? '🧲' : p.type === 'shield' ? '🛡️' : '⏱️', p.x, p.y);
        });

        // Monedas
        ctx.fillStyle = '#ffe600'; ctx.shadowColor = '#ffe600'; ctx.shadowBlur = 10;
        coins.forEach(coin => {
          ctx.beginPath(); ctx.arc(coin.x, coin.y, coin.radius, 0, Math.PI * 2); ctx.fill();
        });

        // Línea de tiro
        if (ball.isDragging) {
          ctx.beginPath(); ctx.moveTo(CENTER.x, CENTER.y); ctx.lineTo(ball.x, ball.y);
          ctx.strokeStyle = '#ff007f'; ctx.lineWidth = 3; ctx.stroke();
        }

        // Estela
        trail.forEach(t => {
          ctx.beginPath(); ctx.arc(t.x, t.y, ball.radius * 0.5, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(0, 240, 255, ${t.alpha})`; ctx.fill();
          t.alpha -= 0.05;
        });

        // Bola
        ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fillStyle = ball.magnetActive ? '#00e5ff' : ball.isReturning ? '#ff007f' : '#00f0ff';
        ctx.fill();

        // Aura de Escudo Activo
        if (ball.shieldActive) {
          ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius + 6, 0, Math.PI * 2);
          ctx.strokeStyle = '#00ff66'; ctx.lineWidth = 2; ctx.stroke();
        }
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    showStartScreen();
    loop();
  </script>
</body>
</html>
